[workspace]
members = [
  "crates/rust-bridge",
  "crates/rust-shared",
  "apps/gui/src-tauri"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["wujie-ai-team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
anyhow = "1"
thiserror = "1"
